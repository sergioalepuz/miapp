<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi lista</title>
  <style>
    :root { --azul: #1b9de2; --fondo: #f6f6f6; --rojo: #e53935; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      background: var(--fondo);
      color: #111;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .barra { position: relative; display: flex; align-items: center; gap: 16px; padding: 10px 12px; }
    #entrada {
      flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px; background: #fff;
    }
    .barra button {
      background: none; border: 0; color: var(--azul);
      font-size: 20px; font-weight: 700; padding: 4px;
    }

    /* Menú de los tres puntos */
    #menuPanel {
      display: none; position: absolute; right: 12px; top: calc(100% - 4px); z-index: 6;
      min-width: 190px; background: #fff; border: 1px solid #ddd; border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,.2); overflow: hidden;
    }
    #menuPanel button {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      border-top: 1px solid #eee; padding: 14px 16px; font-size: 18px; font-weight: 500; color: #111;
    }
    #menuPanel button:first-child { border-top: 0; }

    /* Sugerencias al escribir */
    #sugerencias {
      display: none; position: absolute; left: 12px; right: 12px; top: calc(100% - 4px);
      z-index: 5; background: #fff; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); max-height: 40vh; overflow-y: auto;
    }
    .sugerencia {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 14px; font-size: 18px; border-top: 1px solid #eee;
    }
    .sugerencia:first-child { border-top: 0; }
    .sugerencia small { color: #888; font-size: 14px; }

    /* Sección: cabecera azul + sus alimentos, todo en un grupo que se puede arrastrar */
    .grupo { position: relative; }
    .grupo.arrastrando {
      z-index: 10; background: var(--fondo);
      box-shadow: 0 6px 18px rgba(0,0,0,.3);
    }
    .seccion {
      position: relative; display: flex; align-items: center; justify-content: center;
      background: var(--azul); color: #fff; font-size: 17px; padding: 6px 56px;
      user-select: none; -webkit-user-select: none; border-bottom: 1px solid #eee;
    }
    .asa {
      position: absolute; right: 0; top: 0; bottom: 0; width: 56px;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: grab;
    }

    /* Cada fila: detrás hay dos botones (azul a la izquierda, rojo a la derecha) y el item se desliza por encima */
    .fila { position: relative; overflow: hidden; border-bottom: 1px solid #eee; }
    .borrar, .editar {
      position: absolute; top: 0; padding: 0; color: #fff; border: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .borrar { right: 0; bottom: 0; width: 80px; background: var(--rojo); }
    /* Cuadrado: el ancho es igual al alto de la fila */
    .editar { left: 0; height: 100%; width: auto; aspect-ratio: 1 / 1; background: var(--azul); }
    .item {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      background: #fff; font-weight: 600;
      padding: 4px 16px;   /* margen: arriba y abajo / a los lados */
      font-size: 30px;     /* tamaño de la letra */
      touch-action: pan-y; user-select: none; -webkit-user-select: none;
    }
    .item.tachado span { text-decoration: line-through; color: #999; }

    /* Pantallas de mantenimiento (Alimentos y Categorías) */
    #pantalla {
      display: none; position: fixed; inset: 0; z-index: 25; background: var(--fondo);
      flex-direction: column; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    }
    #pantalla.abierta { display: flex; }
    .cabecera {
      position: relative; display: flex; align-items: center; justify-content: center;
      padding: 14px; background: var(--azul); color: #fff; font-size: 18px; font-weight: 600;
    }
    #atras {
      position: absolute; left: 0; top: 0; bottom: 0; padding: 0 14px;
      background: none; border: 0; color: #fff; font-size: 17px;
    }
    /* Botón + : símbolo azul sobre fondo blanco */
    #mas {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      width: 34px; height: 34px; padding: 0; border: 0; border-radius: 8px;
      background: #fff; color: var(--azul);
      display: flex; align-items: center; justify-content: center;
    }
    #contenidoPantalla { flex: 1; overflow-y: auto; }
    .registro {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      background: #fff; border-bottom: 1px solid #eee; padding: 14px 16px;
      font-size: 20px; font-weight: 600;
    }
    .registro small { color: #888; font-size: 14px; font-weight: 400; text-align: right; }
    .vacio { padding: 24px 16px; color: #888; text-align: center; }

    /* Ventanas pequeñas (editar y confirmar) */
    .velo {
      position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
    }
    .velo.abierto { display: flex; }
    .velo-confirmar { z-index: 40; }
    .caja {
      background: #fff; border-radius: 14px; width: min(80%, 320px);
      max-height: 70%; overflow-y: auto; padding: 8px 0;
    }
    .caja h2 { margin: 0; padding: 10px 16px; font-size: 15px; color: #666; font-weight: 600; }
    .caja .mensaje { margin: 0; padding: 8px 16px 0; font-size: 17px; line-height: 1.35; }
    .editor { padding: 0 16px 8px; }
    .editor label { display: block; font-size: 13px; color: #666; margin: 12px 0 4px; }
    .editor input, .editor select {
      width: 100%; font-size: 16px; padding: 10px;
      border: 1px solid #ddd; border-radius: 8px; background: #fff;
    }
    /* Botones de las ventanas: centrados */
    .acciones { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; padding: 0 8px 4px; }
    .acciones button {
      border: 0; background: none; padding: 8px 10px;
      font-size: 18px; color: var(--azul); font-weight: 600;
    }
    .acciones .guardar { font-weight: 700; }
    .acciones .peligro { color: var(--rojo); font-weight: 700; }

    /* Mensaje: aparece al instante y se desvanece despacio al quitar .visible */
    #aviso {
      position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px);
      transform: translateX(-50%); z-index: 50; width: max-content; max-width: 90vw; text-align: center;
      background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 16px;
      opacity: 0; pointer-events: none; transition: opacity 1s;
    }
    #aviso.visible { opacity: 1; transition: opacity .15s; }
  </style>
</head>
<body>
  <div class="barra">
    <input id="entrada" type="text" placeholder="Añadir alimento" autocomplete="off">
    <button id="ok">Ok</button>
    <button id="menu">···</button>
    <div id="sugerencias"></div>
    <div id="menuPanel">
      <button id="menuEliminar">Eliminar</button>
      <button id="menuAlimentos">Alimentos</button>
      <button id="menuCategorias">Categorías</button>
    </div>
  </div>

  <div id="lista"></div>

  <div id="pantalla">
    <div class="cabecera">
      <button id="atras">‹ Atrás</button>
      <span id="tituloPantalla"></span>
      <button id="mas" aria-label="Añadir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="contenidoPantalla"></div>
  </div>

  <div class="velo" id="velo"><div class="caja" id="caja"></div></div>
  <div class="velo velo-confirmar" id="veloConfirmar"><div class="caja" id="cajaConfirmar"></div></div>
  <div id="aviso"></div>

  <script>
    const SECCIONES_INICIALES = ["Otros", "Fruta", "Verdura", "Carne", "Pescado", "Lácteos", "Panadería", "Limpieza"];
    const SECCION_POR_DEFECTO = "otros";
    const OPCION_NUEVA = "__nueva__"; // opción "Nueva categoría…" del desplegable

    const ICONO_ASA = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 8h16M4 12h16M4 16h16"/></svg>';
    const ICONO_LAPIZ = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
    const ICONO_PAPELERA = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

    const ANCHO_PAPELERA = 80; // debe coincidir con el width de .borrar

    const entrada = document.getElementById("entrada");
    const sugerenciasEl = document.getElementById("sugerencias");
    const menuPanel = document.getElementById("menuPanel");
    const lista = document.getElementById("lista");
    const pantalla = document.getElementById("pantalla");
    const tituloPantalla = document.getElementById("tituloPantalla");
    const contenidoPantalla = document.getElementById("contenidoPantalla");
    const velo = document.getElementById("velo");
    const caja = document.getElementById("caja");
    const veloConfirmar = document.getElementById("veloConfirmar");
    const cajaConfirmar = document.getElementById("cajaConfirmar");
    const avisoEl = document.getElementById("aviso");

    const clave = texto => texto.trim().toLowerCase();
    // Para comparar sin distinguir mayúsculas ni tildes (Limón = limon)
    const normalizar = texto => texto.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    // Formato de los alimentos: primera letra en mayúscula y el resto en minúscula
    const formatear = texto => {
      const t = texto.trim().replace(/\s+/g, " ").toLocaleLowerCase("es");
      return t.charAt(0).toLocaleUpperCase("es") + t.slice(1);
    };
    const porOrden = (a, b) => (a.orden ?? 9999) - (b.orden ?? 9999);
    const porNombre = (a, b) => a.nombre.localeCompare(b.nombre, "es");
    // Un alimento está en la lista salvo que se haya quitado (los antiguos sin marca cuentan como "en la lista")
    const enLista = a => a.enLista !== false;
    const pedir = req => new Promise((ok, fallo) => {
      req.onsuccess = () => ok(req.result);
      req.onerror = () => fallo(req.error);
    });

    let db;
    const tabla = (nombre, modo = "readonly") => db.transaction(nombre, modo).objectStore(nombre);

    // Base de datos: tablas "secciones" (las categorías, con su orden) y "alimentos" (el catálogo de alimentos).
    // La clave (nombre en minúsculas) hace que no se puedan repetir.
    function abrirBD() {
      return new Promise((ok, fallo) => {
        const req = indexedDB.open("miapp", 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          const secciones = d.createObjectStore("secciones", { keyPath: "clave" });
          d.createObjectStore("alimentos", { keyPath: "clave" });
          SECCIONES_INICIALES.forEach((n, i) => secciones.add({ clave: clave(n), nombre: n, orden: i }));
        };
        req.onsuccess = () => ok(req.result);
        req.onerror = () => fallo(req.error);
      });
    }

    // Guarda varios registros de una tabla de una vez
    function escribir(nombreTabla, registros) {
      return new Promise((ok, fallo) => {
        const t = db.transaction(nombreTabla, "readwrite");
        const st = t.objectStore(nombreTabla);
        registros.forEach(r => st.put(r));
        t.oncomplete = ok;
        t.onerror = () => fallo(t.error);
      });
    }

    // Las secciones guardadas antes de existir el orden reciben uno
    async function asegurarOrden() {
      const secciones = await pedir(tabla("secciones").getAll());
      if (secciones.every(s => typeof s.orden === "number")) return;
      const base = SECCIONES_INICIALES.map(clave);
      const pos = s => { const i = base.indexOf(s.clave); return i === -1 ? 1000 : i; };
      secciones.sort((a, b) => pos(a) - pos(b));
      secciones.forEach((s, i) => { s.orden = i; });
      await escribir("secciones", secciones);
    }

    // Pone en el formato correcto los alimentos que ya estaban guardados
    async function normalizarNombres() {
      const alimentos = await pedir(tabla("alimentos").getAll());
      for (const a of alimentos) {
        const bueno = formatear(a.nombre);
        if (a.nombre !== bueno) {
          a.nombre = bueno;
          await pedir(tabla("alimentos", "readwrite").put(a));
        }
      }
    }

    let temporizadorAviso;
    function aviso(texto) {
      avisoEl.textContent = texto;
      avisoEl.classList.add("visible");
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(() => avisoEl.classList.remove("visible"), 2000);
    }

    // Ventana de confirmación: devuelve true si se acepta y false si se cancela
    function confirmar(mensaje, textoAceptar) {
      return new Promise(resolver => {
        cajaConfirmar.innerHTML = "";
        const texto = document.createElement("p");
        texto.className = "mensaje";
        texto.textContent = mensaje;

        const acciones = document.createElement("div");
        acciones.className = "acciones";
        const cancelar = document.createElement("button");
        cancelar.textContent = "Cancelar";
        const aceptar = document.createElement("button");
        aceptar.className = "peligro";
        aceptar.textContent = textoAceptar;

        const cerrar = valor => {
          veloConfirmar.classList.remove("abierto");
          resolver(valor);
        };
        cancelar.onclick = () => cerrar(false);
        aceptar.onclick = () => cerrar(true);
        veloConfirmar.onclick = e => { if (e.target === veloConfirmar) cerrar(false); };

        acciones.append(cancelar, aceptar);
        cajaConfirmar.append(texto, acciones);
        veloConfirmar.classList.add("abierto");
      });
    }

    // Vuelve a poner en la lista un alimento que ya estaba guardado en el catálogo
    async function ponerEnLista(alimento) {
      alimento.enLista = true;
      alimento.tachado = false;
      await pedir(tabla("alimentos", "readwrite").put(alimento));
    }

    // Sugerencias: todos los alimentos guardados que empiezan por lo que escribes
    let ultimaBusqueda = 0;
    async function sugerir() {
      const id = ++ultimaBusqueda;
      const texto = normalizar(entrada.value);
      if (!texto) {
        sugerenciasEl.style.display = "none";
        return;
      }
      const alimentos = await pedir(tabla("alimentos").getAll());
      const secciones = await pedir(tabla("secciones").getAll());
      if (id !== ultimaBusqueda) return; // llegó una búsqueda más reciente

      const nombreSeccion = Object.fromEntries(secciones.map(s => [s.clave, s.nombre]));
      const coincidencias = alimentos
        .filter(a => normalizar(a.nombre).startsWith(texto))
        .sort(porNombre);

      sugerenciasEl.innerHTML = "";
      if (!coincidencias.length) {
        sugerenciasEl.style.display = "none";
        return;
      }
      for (const a of coincidencias) {
        const fila = document.createElement("div");
        fila.className = "sugerencia";
        const nombre = document.createElement("span");
        nombre.textContent = a.nombre;
        const seccion = document.createElement("small");
        // La marca ✓ indica que ya está en la lista
        seccion.textContent = (enLista(a) ? "✓ " : "") + (nombreSeccion[a.seccion] || "");
        fila.append(nombre, seccion);
        fila.onclick = async () => {
          entrada.value = "";
          if (enLista(a)) {
            aviso("Ya está en la lista");
          } else {
            await ponerEnLista(a);
            await pintar();
          }
          sugerir();
        };
        sugerenciasEl.appendChild(fila);
      }
      sugerenciasEl.style.display = "block";
    }

    async function anadir() {
      const nombre = formatear(entrada.value);
      if (!nombre) return;
      const existente = await pedir(tabla("alimentos").get(clave(nombre)));
      if (existente) {
        if (enLista(existente)) {
          aviso("Ya está en la lista");
          return;
        }
        await ponerEnLista(existente); // estaba guardado: vuelve a su categoría
      } else {
        await pedir(tabla("alimentos", "readwrite").add({
          clave: clave(nombre), nombre, seccion: SECCION_POR_DEFECTO, tachado: false, enLista: true
        }));
      }
      entrada.value = "";
      sugerir();
      await pintar();
    }

    async function pintar() {
      const secciones = (await pedir(tabla("secciones").getAll())).sort(porOrden);
      const alimentos = await pedir(tabla("alimentos").getAll());
      lista.innerHTML = "";
      for (const s of secciones) {
        const items = alimentos
          .filter(a => a.seccion === s.clave && enLista(a))
          .sort(porNombre);
        if (!items.length) continue; // una sección sin alimentos en la lista no se muestra

        const grupo = document.createElement("div");
        grupo.className = "grupo";
        grupo.dataset.clave = s.clave;

        const cab = document.createElement("div");
        cab.className = "seccion";
        const tituloSeccion = document.createElement("span");
        tituloSeccion.textContent = s.nombre;
        cab.appendChild(tituloSeccion);
        const asa = document.createElement("div");
        asa.className = "asa";
        asa.innerHTML = ICONO_ASA;
        asa.setAttribute("aria-label", "Arrastrar sección");
        cab.appendChild(asa);
        grupo.appendChild(cab);

        for (const a of items) {
          const fila = document.createElement("div");
          fila.className = "fila";

          // Botón azul cuadrado (aparece al deslizar a la derecha)
          const editar = document.createElement("button");
          editar.className = "editar";
          editar.innerHTML = ICONO_LAPIZ;
          editar.setAttribute("aria-label", "Editar");

          // Botón rojo (aparece al deslizar a la izquierda)
          const papelera = document.createElement("button");
          papelera.className = "borrar";
          papelera.innerHTML = ICONO_PAPELERA;
          papelera.setAttribute("aria-label", "Quitar de la lista");
          papelera.onclick = () => quitarDeLista(a);

          const item = document.createElement("div");
          item.className = "item" + (a.tachado ? " tachado" : "");
          const nombre = document.createElement("span");
          nombre.textContent = a.nombre;
          item.appendChild(nombre);

          fila.append(editar, papelera, item);
          grupo.appendChild(fila);
          activarGestos(item, a, editar);
          editar.onclick = () => {
            item.cerrarFila();
            abrirEditor(a, false);
          };
        }

        lista.appendChild(grupo);
        activarArrastreSeccion(grupo, asa);
      }
    }

    // Arrastrar una sección (desde el icono de las tres rayas) para cambiar su orden
    function activarArrastreSeccion(grupo, asa) {
      let inicioY = 0, topInicial = 0, activo = false;

      asa.addEventListener("pointerdown", e => {
        e.preventDefault();
        activo = true;
        asa.setPointerCapture(e.pointerId);
        inicioY = e.clientY;
        topInicial = grupo.getBoundingClientRect().top;
        grupo.style.transition = "none";
        grupo.classList.add("arrastrando");
      });

      asa.addEventListener("pointermove", e => {
        if (!activo) return;
        const deseado = topInicial + (e.clientY - inicioY);
        grupo.style.transform = "";
        const centro = deseado + grupo.offsetHeight / 2;

        let anterior = grupo.previousElementSibling;
        while (anterior && centro < anterior.getBoundingClientRect().top + anterior.offsetHeight / 2) {
          lista.insertBefore(grupo, anterior);
          anterior = grupo.previousElementSibling;
        }
        let siguiente = grupo.nextElementSibling;
        while (siguiente && centro > siguiente.getBoundingClientRect().top + siguiente.offsetHeight / 2) {
          lista.insertBefore(siguiente, grupo);
          siguiente = grupo.nextElementSibling;
        }

        const natural = grupo.getBoundingClientRect().top;
        grupo.style.transform = "translateY(" + (deseado - natural) + "px)";
      });

      const soltar = async () => {
        if (!activo) return;
        activo = false;
        grupo.style.transition = "transform .15s";
        grupo.style.transform = "";
        setTimeout(() => grupo.classList.remove("arrastrando"), 150);
        await guardarOrden();
      };
      asa.addEventListener("pointerup", soltar);
      asa.addEventListener("pointercancel", soltar);
    }

    // Guarda el orden que ha quedado en pantalla.
    // Las secciones que ahora no se ven (sin alimentos en la lista) conservan su sitio.
    async function guardarOrden() {
      const visibles = [...lista.children].map(g => g.dataset.clave);
      const todas = (await pedir(tabla("secciones").getAll())).sort(porOrden);
      const orden = todas.map(s => s.clave);
      let k = 0;
      todas.forEach((s, i) => {
        if (visibles.includes(s.clave)) orden[i] = visibles[k++];
      });
      const porClave = Object.fromEntries(todas.map(s => [s.clave, s]));
      const nuevas = orden.map((c, i) => { porClave[c].orden = i; return porClave[c]; });
      await escribir("secciones", nuevas);
    }

    // Pulsar = tachar/destachar.
    // Deslizar a la izquierda = papelera (roja). Deslizar a la derecha = editar (azul, cuadrado).
    function activarGestos(item, alimento, editar) {
      let x0 = 0, y0 = 0, dx = 0;
      let activo = false, arrastrando = false;
      let reposo = 0; // 0 = cerrado; negativo = papelera visible; positivo = cuadro azul visible

      const anchoEditar = () => editar.offsetWidth; // el cuadrado mide lo mismo que el alto de la fila
      const mover = px => { item.style.transform = "translateX(" + px + "px)"; };

      // Permite cerrar la fila desde fuera (al abrir la ventana de edición)
      item.cerrarFila = () => {
        item.style.transition = "transform .2s";
        reposo = 0;
        mover(0);
      };

      item.addEventListener("pointerdown", e => {
        activo = true;
        arrastrando = false;
        x0 = e.clientX;
        y0 = e.clientY;
        dx = 0;
        item.style.transition = "none";
      });

      item.addEventListener("pointermove", e => {
        if (!activo) return;
        dx = e.clientX - x0;
        const dy = e.clientY - y0;
        if (!arrastrando && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
          arrastrando = true;
          item.setPointerCapture(e.pointerId);
        }
        if (arrastrando) {
          mover(Math.max(-ANCHO_PAPELERA, Math.min(anchoEditar(), reposo + dx)));
        }
      });

      const terminar = async e => {
        if (!activo) return;
        activo = false;
        item.style.transition = "transform .2s";
        if (arrastrando) {
          const final = reposo + dx;
          if (final < -ANCHO_PAPELERA / 2) reposo = -ANCHO_PAPELERA;
          else if (final > anchoEditar() / 2) reposo = anchoEditar();
          else reposo = 0;
          mover(reposo);
        } else if (e.type === "pointerup") {
          if (reposo !== 0) {
            reposo = 0;
            mover(0);
          } else {
            await alternarTachado(alimento);
          }
        }
      };
      item.addEventListener("pointerup", terminar);
      item.addEventListener("pointercancel", terminar);
    }

    async function alternarTachado(alimento) {
      alimento.tachado = !alimento.tachado;
      await pedir(tabla("alimentos", "readwrite").put(alimento));
      pintar();
    }

    // La papelera quita el alimento de la lista, pero sigue guardado en la tabla alimentos
    async function quitarDeLista(alimento) {
      alimento.enLista = false;
      alimento.tachado = false;
      await pedir(tabla("alimentos", "readwrite").put(alimento));
      pintar();
    }

    // Menú ··· > Eliminar: quita de la lista todos los alimentos tachados (con confirmación)
    async function eliminarTachados() {
      const alimentos = await pedir(tabla("alimentos").getAll());
      const tachados = alimentos.filter(a => enLista(a) && a.tachado);
      if (!tachados.length) {
        aviso("No hay alimentos tachados");
        return;
      }
      const pregunta = tachados.length === 1
        ? "¿Eliminar de la lista el alimento tachado?"
        : "¿Eliminar de la lista los " + tachados.length + " alimentos tachados?";
      if (!(await confirmar(pregunta, "Eliminar"))) return;
      tachados.forEach(a => { a.enLista = false; a.tachado = false; });
      await escribir("alimentos", tachados);
      pintar();
    }

    // Devuelve la clave de una categoría; si no existe, la crea al final de las demás
    async function asegurarSeccion(texto) {
      const nombre = texto.trim().replace(/\s+/g, " ");
      const todas = await pedir(tabla("secciones").getAll());
      const existente = todas.find(s => s.clave === clave(nombre));
      if (existente) return existente.clave;
      const orden = todas.reduce((m, s) => Math.max(m, s.orden ?? 0), -1) + 1;
      await pedir(tabla("secciones", "readwrite").add({ clave: clave(nombre), nombre, orden }));
      return clave(nombre);
    }

    // ---------- Pantallas de mantenimiento ----------
    let pantallaActual = null; // "alimentos" o "categorias"

    function abrirPantalla(tipo, titulo) {
      pantallaActual = tipo;
      tituloPantalla.textContent = titulo;
      pantalla.classList.add("abierta");
    }

    // Vuelve a dibujar la pantalla de mantenimiento si está abierta (conserva el desplazamiento)
    async function refrescarPantalla() {
      if (!pantalla.classList.contains("abierta")) return;
      const y = contenidoPantalla.scrollTop;
      if (pantallaActual === "alimentos") await mostrarAlimentos();
      else await mostrarCategorias();
      contenidoPantalla.scrollTop = y;
    }

    // Menú ··· > Alimentos: todos los alimentos de la base de datos, por orden alfabético
    async function mostrarAlimentos() {
      abrirPantalla("alimentos", "Alimentos");
      const alimentos = (await pedir(tabla("alimentos").getAll())).sort(porNombre);
      const secciones = await pedir(tabla("secciones").getAll());
      const nombreSeccion = Object.fromEntries(secciones.map(s => [s.clave, s.nombre]));

      contenidoPantalla.innerHTML = "";
      if (!alimentos.length) {
        const vacio = document.createElement("div");
        vacio.className = "vacio";
        vacio.textContent = "Todavía no hay alimentos";
        contenidoPantalla.appendChild(vacio);
        return;
      }
      for (const a of alimentos) {
        const fila = document.createElement("div");
        fila.className = "registro";
        const nombre = document.createElement("span");
        nombre.textContent = a.nombre;
        const categoria = document.createElement("small");
        // La marca ✓ indica que está en la lista
        categoria.textContent = (enLista(a) ? "✓ " : "") + (nombreSeccion[a.seccion] || "");
        fila.append(nombre, categoria);
        fila.onclick = () => abrirEditor(a, true);
        contenidoPantalla.appendChild(fila);
      }
    }

    // Menú ··· > Categorías: todas las categorías por orden alfabético, con su número de alimentos
    async function mostrarCategorias() {
      abrirPantalla("categorias", "Categorías");
      const secciones = (await pedir(tabla("secciones").getAll())).sort(porNombre);
      const alimentos = await pedir(tabla("alimentos").getAll());

      contenidoPantalla.innerHTML = "";
      for (const s of secciones) {
        const total = alimentos.filter(a => a.seccion === s.clave).length;
        const fila = document.createElement("div");
        fila.className = "registro";
        const nombre = document.createElement("span");
        nombre.textContent = s.nombre;
        const cuantos = document.createElement("small");
        cuantos.textContent = total === 1 ? "1 alimento" : total + " alimentos";
        fila.append(nombre, cuantos);
        fila.onclick = () => abrirEditorCategoria(s);
        contenidoPantalla.appendChild(fila);
      }
    }

    // Ventana para cambiar el nombre y la categoría de un alimento, o para crear uno nuevo (alimento = null).
    // Si viene de Alimentos (mantenimiento) también permite eliminarlo de la base de datos.
    async function abrirEditor(alimento, mantenimiento) {
      const nuevo = !alimento;
      const secciones = (await pedir(tabla("secciones").getAll())).sort(porOrden);
      caja.innerHTML = "";

      const titulo = document.createElement("h2");
      titulo.textContent = nuevo ? "Nuevo alimento" : "Editar alimento";
      caja.appendChild(titulo);

      const editor = document.createElement("div");
      editor.className = "editor";

      const etiquetaNombre = document.createElement("label");
      etiquetaNombre.textContent = "Nombre";
      const campo = document.createElement("input");
      campo.type = "text";
      campo.value = nuevo ? "" : alimento.nombre;
      campo.autocomplete = "off";

      const etiquetaSeccion = document.createElement("label");
      etiquetaSeccion.textContent = "Categoría";
      const desplegable = document.createElement("select");
      const seccionInicial = nuevo ? SECCION_POR_DEFECTO : alimento.seccion;
      for (const s of secciones) {
        const o = document.createElement("option");
        o.value = s.clave;
        o.textContent = s.nombre;
        if (s.clave === seccionInicial) o.selected = true;
        desplegable.appendChild(o);
      }
      const opcionNueva = document.createElement("option");
      opcionNueva.value = OPCION_NUEVA;
      opcionNueva.textContent = "+ Nueva categoría…";
      desplegable.appendChild(opcionNueva);

      // Casilla para escribir el nombre de una categoría nueva (solo se ve si eliges "Nueva categoría…")
      const campoNueva = document.createElement("input");
      campoNueva.type = "text";
      campoNueva.placeholder = "Nombre de la nueva categoría";
      campoNueva.autocomplete = "off";
      campoNueva.style.display = "none";
      campoNueva.style.marginTop = "8px";
      desplegable.onchange = () => {
        const otra = desplegable.value === OPCION_NUEVA;
        campoNueva.style.display = otra ? "block" : "none";
        if (otra) campoNueva.focus();
      };

      const acciones = document.createElement("div");
      acciones.className = "acciones";

      if (mantenimiento && !nuevo) {
        const eliminar = document.createElement("button");
        eliminar.className = "peligro";
        eliminar.textContent = "Eliminar";
        eliminar.onclick = async () => {
          const pregunta = "¿Eliminar «" + alimento.nombre + "» de los alimentos?" +
            (enLista(alimento) ? " También se quitará de la lista." : "");
          if (!(await confirmar(pregunta, "Eliminar"))) return;
          await pedir(tabla("alimentos", "readwrite").delete(alimento.clave));
          velo.classList.remove("abierto");
          await pintar();
          refrescarPantalla();
        };
        acciones.appendChild(eliminar);
      }

      const cancelar = document.createElement("button");
      cancelar.textContent = "Cancelar";
      cancelar.onclick = () => velo.classList.remove("abierto");
      const guardar = document.createElement("button");
      guardar.className = "guardar";
      guardar.textContent = "Guardar";

      const guardarCambios = async () => {
        const nombre = formatear(campo.value);
        if (!nombre) {
          aviso("Escribe un nombre");
          return;
        }
        let seccion = desplegable.value;
        if (seccion === OPCION_NUEVA) {
          if (!campoNueva.value.trim()) {
            aviso("Escribe el nombre de la categoría");
            return;
          }
          seccion = await asegurarSeccion(campoNueva.value);
        }
        const guardado = nuevo
          ? await crearAlimento(nombre, seccion)
          : await guardarEdicion(alimento, nombre, seccion);
        if (!guardado) {
          aviso("Ya existe ese alimento");
          return;
        }
        velo.classList.remove("abierto");
        await pintar();          // si está en la lista, se actualiza su nombre y su categoría
        refrescarPantalla();
      };
      guardar.onclick = guardarCambios;
      campo.onkeydown = e => { if (e.key === "Enter") guardarCambios(); };
      campoNueva.onkeydown = e => { if (e.key === "Enter") guardarCambios(); };

      acciones.append(cancelar, guardar);
      editor.append(etiquetaNombre, campo, etiquetaSeccion, desplegable, campoNueva, acciones);
      caja.appendChild(editor);
      velo.classList.add("abierto");
      if (nuevo) campo.focus();
    }

    // Añade un alimento nuevo a la base de datos (sin ponerlo en la lista). Devuelve false si ya existe.
    async function crearAlimento(nombre, seccion) {
      const existente = await pedir(tabla("alimentos").get(clave(nombre)));
      if (existente) return false;
      await pedir(tabla("alimentos", "readwrite").add({
        clave: clave(nombre), nombre, seccion, tachado: false, enLista: false
      }));
      return true;
    }

    // Guarda el nombre y la categoría nuevos. Como el nombre es la clave del registro,
    // si cambia hay que crear el nuevo y borrar el antiguo (devuelve false si ya existe otro igual).
    function guardarEdicion(alimento, nombre, seccion) {
      return new Promise((ok, fallo) => {
        const nuevaClave = clave(nombre);
        const t = db.transaction("alimentos", "readwrite");
        const st = t.objectStore("alimentos");
        t.oncomplete = () => ok(true);
        t.onerror = () => fallo(t.error);

        const existente = st.get(nuevaClave);
        existente.onsuccess = () => {
          const cambiaClave = nuevaClave !== alimento.clave;
          if (cambiaClave && existente.result) {
            ok(false); // ya hay otro alimento con ese nombre: no se guarda nada
            return;
          }
          if (cambiaClave) st.delete(alimento.clave);
          st.put({ ...alimento, clave: nuevaClave, nombre, seccion });
        };
      });
    }

    // Ventana para cambiar el nombre de una categoría o eliminarla, o para crear una nueva (categoria = null)
    async function abrirEditorCategoria(categoria) {
      const nueva = !categoria;
      if (!nueva && categoria.clave === SECCION_POR_DEFECTO) {
        aviso("La categoría Otros no se puede modificar");
        return;
      }
      caja.innerHTML = "";

      const titulo = document.createElement("h2");
      titulo.textContent = nueva ? "Nueva categoría" : "Editar categoría";
      caja.appendChild(titulo);

      const editor = document.createElement("div");
      editor.className = "editor";
      const etiqueta = document.createElement("label");
      etiqueta.textContent = "Nombre";
      const campo = document.createElement("input");
      campo.type = "text";
      campo.value = nueva ? "" : categoria.nombre;
      campo.autocomplete = "off";

      const acciones = document.createElement("div");
      acciones.className = "acciones";

      if (!nueva) {
        const eliminar = document.createElement("button");
        eliminar.className = "peligro";
        eliminar.textContent = "Eliminar";
        eliminar.onclick = async () => {
          const alimentos = await pedir(tabla("alimentos").getAll());
          const total = alimentos.filter(a => a.seccion === categoria.clave).length;
          let pregunta = "¿Eliminar la categoría «" + categoria.nombre + "»?";
          if (total === 1) pregunta += " Su alimento pasará a «Otros».";
          else if (total > 1) pregunta += " Sus " + total + " alimentos pasarán a «Otros».";
          if (!(await confirmar(pregunta, "Eliminar"))) return;
          await eliminarCategoria(categoria.clave);
          velo.classList.remove("abierto");
          await pintar();
          refrescarPantalla();
        };
        acciones.appendChild(eliminar);
      }

      const cancelar = document.createElement("button");
      cancelar.textContent = "Cancelar";
      cancelar.onclick = () => velo.classList.remove("abierto");
      const guardar = document.createElement("button");
      guardar.className = "guardar";
      guardar.textContent = "Guardar";

      const guardarCambios = async () => {
        const nombre = campo.value.trim().replace(/\s+/g, " ");
        if (!nombre) {
          aviso("Escribe un nombre");
          return;
        }
        if (nueva) {
          const todas = await pedir(tabla("secciones").getAll());
          if (todas.some(s => s.clave === clave(nombre))) {
            aviso("Ya existe esa categoría");
            return;
          }
          await asegurarSeccion(nombre); // se añade al final de las demás
        } else {
          if (clave(nombre) === SECCION_POR_DEFECTO) {
            aviso("Ya existe esa categoría");
            return;
          }
          const guardado = await renombrarCategoria(categoria, nombre);
          if (!guardado) {
            aviso("Ya existe esa categoría");
            return;
          }
        }
        velo.classList.remove("abierto");
        await pintar();
        refrescarPantalla();
      };
      guardar.onclick = guardarCambios;
      campo.onkeydown = e => { if (e.key === "Enter") guardarCambios(); };

      acciones.append(cancelar, guardar);
      editor.append(etiqueta, campo, acciones);
      caja.appendChild(editor);
      velo.classList.add("abierto");
      if (nueva) campo.focus();
    }

    // Cambia el nombre de una categoría y actualiza todos los alimentos que pertenecían a ella
    // (devuelve false si ya existe otra categoría con ese nombre)
    function renombrarCategoria(categoria, nombre) {
      return new Promise((ok, fallo) => {
        const nuevaClave = clave(nombre);
        const t = db.transaction(["secciones", "alimentos"], "readwrite");
        const sec = t.objectStore("secciones");
        const alim = t.objectStore("alimentos");
        t.oncomplete = () => ok(true);
        t.onerror = () => fallo(t.error);

        const existente = sec.get(nuevaClave);
        existente.onsuccess = () => {
          const cambiaClave = nuevaClave !== categoria.clave;
          if (cambiaClave && existente.result) {
            ok(false); // ya hay otra categoría con ese nombre: no se guarda nada
            return;
          }
          if (!cambiaClave) {
            sec.put({ ...categoria, nombre }); // solo cambian mayúsculas o espacios
            return;
          }
          sec.delete(categoria.clave);
          sec.put({ ...categoria, clave: nuevaClave, nombre });
          const todos = alim.getAll();
          todos.onsuccess = () => {
            todos.result
              .filter(a => a.seccion === categoria.clave)
              .forEach(a => alim.put({ ...a, seccion: nuevaClave }));
          };
        };
      });
    }

    // Elimina una categoría: todos sus alimentos pasan a "Otros"
    function eliminarCategoria(claveCategoria) {
      return new Promise((ok, fallo) => {
        const t = db.transaction(["secciones", "alimentos"], "readwrite");
        const sec = t.objectStore("secciones");
        const alim = t.objectStore("alimentos");
        t.oncomplete = () => ok();
        t.onerror = () => fallo(t.error);

        const todos = alim.getAll();
        todos.onsuccess = () => {
          todos.result
            .filter(a => a.seccion === claveCategoria)
            .forEach(a => alim.put({ ...a, seccion: SECCION_POR_DEFECTO }));
          sec.delete(claveCategoria);
        };
      });
    }

    // ---------- Pantalla siempre encendida ----------
    let bloqueoPantalla = null;
    let pidiendoBloqueo = false;
    async function mantenerPantallaEncendida() {
      if (!("wakeLock" in navigator) || bloqueoPantalla || pidiendoBloqueo) return;
      pidiendoBloqueo = true;
      try {
        bloqueoPantalla = await navigator.wakeLock.request("screen");
        bloqueoPantalla.addEventListener("release", () => { bloqueoPantalla = null; });
      } catch (e) {
        bloqueoPantalla = null; // el móvil puede rechazarlo (por ejemplo, con poca batería)
      } finally {
        pidiendoBloqueo = false;
      }
    }
    // El bloqueo se pierde al salir de la app: se pide de nuevo al volver
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") mantenerPantallaEncendida();
    });
    // Por si el móvil exige un toque para concederlo
    document.addEventListener("pointerdown", mantenerPantallaEncendida);
    mantenerPantallaEncendida();

    // ---------- Eventos ----------
    velo.onclick = e => { if (e.target === velo) velo.classList.remove("abierto"); };
    document.getElementById("ok").onclick = anadir;
    entrada.onkeydown = e => { if (e.key === "Enter") anadir(); };
    entrada.addEventListener("input", sugerir);
    entrada.addEventListener("focus", sugerir);

    // Botón ··· : abre y cierra el menú
    document.getElementById("menu").onclick = () => {
      const abierto = menuPanel.style.display === "block";
      menuPanel.style.display = abierto ? "none" : "block";
      sugerenciasEl.style.display = "none";
    };
    document.getElementById("menuEliminar").onclick = () => {
      menuPanel.style.display = "none";
      eliminarTachados();
    };
    document.getElementById("menuAlimentos").onclick = () => {
      menuPanel.style.display = "none";
      mostrarAlimentos();
    };
    document.getElementById("menuCategorias").onclick = () => {
      menuPanel.style.display = "none";
      mostrarCategorias();
    };
    document.getElementById("atras").onclick = () => pantalla.classList.remove("abierta");

    // Botón + de las pantallas de mantenimiento: añade un alimento o una categoría nueva
    document.getElementById("mas").onclick = () => {
      if (pantallaActual === "alimentos") abrirEditor(null, true);
      else abrirEditorCategoria(null);
    };

    // Al tocar fuera se cierran las sugerencias y el menú
    document.addEventListener("pointerdown", e => {
      if (!e.target.closest(".barra")) sugerenciasEl.style.display = "none";
      if (!e.target.closest("#menuPanel, #menu")) menuPanel.style.display = "none";
    });

    (async () => {
      db = await abrirBD();
      await asegurarOrden();
      await asegurarSeccion("Otros"); // la categoría por defecto siempre debe existir
      await normalizarNombres();
      pintar();
    })();
  </script>
