<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi lista</title>
  <style>
    :root { --azul: #1b9de2; --fondo: #f6f6f6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      background: var(--fondo);
      color: #111;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    .barra { position: relative; display: flex; align-items: center; gap: 16px; padding: 10px 12px; }
    #entrada {
      flex: 1; min-width: 0; font-size: 16px; padding: 10px 12px;
      border: 1px solid #ddd; border-radius: 8px; background: #fff;
    }
    .barra button {
      background: none; border: 0; color: var(--azul);
      font-size: 20px; font-weight: 700; padding: 4px;
    }

    /* Sugerencias al escribir */
    #sugerencias {
      display: none; position: absolute; left: 12px; right: 12px; top: calc(100% - 4px);
      z-index: 5; background: #fff; border: 1px solid #ddd; border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); max-height: 40vh; overflow-y: auto;
    }
    .sugerencia {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 14px; font-size: 18px; border-top: 1px solid #eee;
    }
    .sugerencia:first-child { border-top: 0; }
    .sugerencia small { color: #888; font-size: 14px; }

    .seccion {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--azul); color: #fff; font-size: 17px; padding: 6px;
    }

    /* Cada fila: la papelera roja queda detrás y el item se desliza por encima */
    .fila { position: relative; overflow: hidden; border-bottom: 1px solid #eee; }
    .borrar {
      position: absolute; right: 0; top: 0; bottom: 0; width: 80px;
      background: #e53935; color: #fff; border: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .item {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      background: #fff; padding: 10px 16px; font-size: 30px; font-weight: 600;
      touch-action: pan-y; user-select: none; -webkit-user-select: none;
    }
    .item.tachado span { text-decoration: line-through; color: #999; }
    .item button { background: none; border: 0; color: var(--azul); padding: 8px; }

    .velo {
      position: fixed; inset: 0; background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
    }
    .velo.abierto { display: flex; }
    .caja {
      background: #fff; border-radius: 14px; width: min(80%, 320px);
      max-height: 70%; overflow-y: auto; padding: 8px 0;
    }
    .caja h2 { margin: 0; padding: 10px 16px; font-size: 15px; color: #666; font-weight: 600; }
    .caja button {
      display: block; width: 100%; text-align: left; background: none;
      border: 0; border-top: 1px solid #eee; padding: 12px 16px; font-size: 18px;
    }
    .caja button.actual { color: var(--azul); font-weight: 700; }
    .nueva { display: flex; gap: 8px; align-items: center; padding: 10px 16px 6px; border-top: 1px solid #eee; }
    .nueva input { flex: 1; min-width: 0; font-size: 16px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; }
    .nueva button { width: auto; border: 0; padding: 8px 4px; color: var(--azul); font-weight: 700; font-size: 18px; }

    /* Mensaje: aparece al instante y se desvanece despacio al quitar .visible */
    #aviso {
      position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 70px);
      transform: translateX(-50%); z-index: 20; white-space: nowrap;
      background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 16px;
      opacity: 0; pointer-events: none; transition: opacity 1s;
    }
    #aviso.visible { opacity: 1; transition: opacity .15s; }
  </style>
</head>
<body>
  <div class="barra">
    <input id="entrada" type="text" placeholder="Añadir alimento" autocomplete="off">
    <button id="ok">Ok</button>
    <button id="menu">···</button>
    <div id="sugerencias"></div>
  </div>

  <div id="lista"></div>

  <div class="velo" id="velo"><div class="caja" id="caja"></div></div>
  <div id="aviso"></div>

  <script>
    const SECCIONES_INICIALES = ["Otros", "Fruta", "Verdura", "Carne", "Pescado", "Lácteos", "Panadería", "Limpieza"];
    const SECCION_POR_DEFECTO = "otros";

    const ICONO_CAPAS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 8l11 6 11-6-11-6zm0 14.5L3.6 12 1 13.4l11 6.1 11-6.1-2.6-1.4L12 16.5zm0 4L3.6 16 1 17.4l11 6.1 11-6.1-2.6-1.4L12 20.5z"/></svg>';
    const ICONO_LAPIZ = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';
    const ICONO_PAPELERA = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

    const ANCHO_PAPELERA = 80; // debe coincidir con el width de .borrar

    const entrada = document.getElementById("entrada");
    const sugerenciasEl = document.getElementById("sugerencias");
    const lista = document.getElementById("lista");
    const velo = document.getElementById("velo");
    const caja = document.getElementById("caja");
    const avisoEl = document.getElementById("aviso");

    const clave = texto => texto.trim().toLowerCase();
    // Para comparar sin distinguir mayúsculas ni tildes (Limón = limon)
    const normalizar = texto => texto.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    // Formato de los alimentos: primera letra en mayúscula y el resto en minúscula
    const formatear = texto => {
      const t = texto.trim().replace(/\s+/g, " ").toLocaleLowerCase("es");
      return t.charAt(0).toLocaleUpperCase("es") + t.slice(1);
    };
    const pedir = req => new Promise((ok, fallo) => {
      req.onsuccess = () => ok(req.result);
      req.onerror = () => fallo(req.error);
    });

    let db;
    const tabla = (nombre, modo = "readonly") => db.transaction(nombre, modo).objectStore(nombre);

    // Base de datos: tablas "secciones" y "alimentos".
    // La clave (nombre en minúsculas) hace que no se puedan repetir.
    function abrirBD() {
      return new Promise((ok, fallo) => {
        const req = indexedDB.open("miapp", 1);
        req.onupgradeneeded = () => {
          const d = req.result;
          const secciones = d.createObjectStore("secciones", { keyPath: "clave" });
          d.createObjectStore("alimentos", { keyPath: "clave" });
          SECCIONES_INICIALES.forEach(n => secciones.add({ clave: clave(n), nombre: n }));
        };
        req.onsuccess = () => ok(req.result);
        req.onerror = () => fallo(req.error);
      });
    }

    // Pone en el formato correcto los alimentos que ya estaban guardados
    async function normalizarNombres() {
      const alimentos = await pedir(tabla("alimentos").getAll());
      for (const a of alimentos) {
        const bueno = formatear(a.nombre);
        if (a.nombre !== bueno) {
          a.nombre = bueno;
          await pedir(tabla("alimentos", "readwrite").put(a));
        }
      }
    }

    let temporizadorAviso;
    function aviso(texto) {
      avisoEl.textContent = texto;
      avisoEl.classList.add("visible");
      clearTimeout(temporizadorAviso);
      temporizadorAviso = setTimeout(() => avisoEl.classList.remove("visible"), 2000);
    }

    // Sugerencias: alimentos de la base de datos que empiezan por lo que escribes
    let ultimaBusqueda = 0;
    async function sugerir() {
      const id = ++ultimaBusqueda;
      const texto = normalizar(entrada.value);
      if (!texto) {
        sugerenciasEl.style.display = "none";
        return;
      }
      const alimentos = await pedir(tabla("alimentos").getAll());
      const secciones = await pedir(tabla("secciones").getAll());
      if (id !== ultimaBusqueda) return; // llegó una búsqueda más reciente

      const nombreSeccion = Object.fromEntries(secciones.map(s => [s.clave, s.nombre]));
      const coincidencias = alimentos
        .filter(a => normalizar(a.nombre).startsWith(texto))
        .sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));

      sugerenciasEl.innerHTML = "";
      if (!coincidencias.length) {
        sugerenciasEl.style.display = "none";
        return;
      }
      for (const a of coincidencias) {
        const fila = document.createElement("div");
        fila.className = "sugerencia";
        const nombre = document.createElement("span");
        nombre.textContent = a.nombre;
        const seccion = document.createElement("small");
        seccion.textContent = nombreSeccion[a.seccion] || "";
        fila.append(nombre, seccion);
        // Todas las sugerencias ya están en la lista: se vacía la casilla y se avisa
        fila.onclick = () => {
          entrada.value = "";
          sugerir();
          aviso("Ya está en la lista");
        };
        sugerenciasEl.appendChild(fila);
      }
      sugerenciasEl.style.display = "block";
    }

    async function anadir() {
      const nombre = formatear(entrada.value);
      if (!nombre) return;
      try {
        await pedir(tabla("alimentos", "readwrite").add({
          clave: clave(nombre), nombre, seccion: SECCION_POR_DEFECTO, tachado: false
        }));
        entrada.value = "";
        sugerir();
        await pintar();
      } catch (e) {
        if (e.name === "ConstraintError") aviso("Ya está en la lista");
        else console.error(e);
      }
    }

    async function pintar() {
      const secciones = await pedir(tabla("secciones").getAll());
      const alimentos = await pedir(tabla("alimentos").getAll());
      lista.innerHTML = "";
      for (const s of secciones) {
        const items = alimentos
          .filter(a => a.seccion === s.clave)
          .sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
        if (!items.length) continue; // una sección sin alimentos no se muestra

        const cab = document.createElement("div");
        cab.className = "seccion";
        cab.innerHTML = ICONO_CAPAS + "<span></span>";
        cab.querySelector("span").textContent = s.nombre;
        lista.appendChild(cab);

        for (const a of items) {
          const fila = document.createElement("div");
          fila.className = "fila";

          const papelera = document.createElement("button");
          papelera.className = "borrar";
          papelera.innerHTML = ICONO_PAPELERA;
          papelera.setAttribute("aria-label", "Borrar");
          papelera.onclick = () => borrar(a);

          const item = document.createElement("div");
          item.className = "item" + (a.tachado ? " tachado" : "");
          const nombre = document.createElement("span");
          nombre.textContent = a.nombre;
          const lapiz = document.createElement("button");
          lapiz.innerHTML = ICONO_LAPIZ;
          lapiz.setAttribute("aria-label", "Cambiar sección");
          lapiz.onclick = () => abrirSelector(a);
          item.append(nombre, lapiz);

          fila.append(papelera, item);
          lista.appendChild(fila);
          activarGestos(item, a);
        }
      }
    }

    // Pulsar = tachar/destachar. Deslizar a la izquierda = mostrar la papelera.
    function activarGestos(item, alimento) {
      let x0 = 0, y0 = 0, dx = 0;
      let activo = false, arrastrando = false, abierto = false;

      const mover = px => { item.style.transform = "translateX(" + px + "px)"; };

      item.addEventListener("pointerdown", e => {
        if (e.target.closest("button")) return; // el lápiz va aparte
        activo = true;
        arrastrando = false;
        x0 = e.clientX;
        y0 = e.clientY;
        dx = 0;
        item.style.transition = "none";
      });

      item.addEventListener("pointermove", e => {
        if (!activo) return;
        dx = e.clientX - x0;
        const dy = e.clientY - y0;
        if (!arrastrando && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
          arrastrando = true;
          item.setPointerCapture(e.pointerId);
        }
        if (arrastrando) {
          const base = abierto ? -ANCHO_PAPELERA : 0;
          mover(Math.max(-ANCHO_PAPELERA, Math.min(0, base + dx)));
        }
      });

      const terminar = async e => {
        if (!activo) return;
        activo = false;
        item.style.transition = "transform .2s";
        if (arrastrando) {
          const base = abierto ? -ANCHO_PAPELERA : 0;
          abierto = base + dx < -ANCHO_PAPELERA / 2;
          mover(abierto ? -ANCHO_PAPELERA : 0);
        } else if (e.type === "pointerup") {
          if (abierto) {
            abierto = false;
            mover(0);
          } else {
            await alternarTachado(alimento);
          }
        }
      };
      item.addEventListener("pointerup", terminar);
      item.addEventListener("pointercancel", terminar);
    }

    async function alternarTachado(alimento) {
      alimento.tachado = !alimento.tachado;
      await pedir(tabla("alimentos", "readwrite").put(alimento));
      pintar();
    }

    async function borrar(alimento) {
      await pedir(tabla("alimentos", "readwrite").delete(alimento.clave));
      pintar();
    }

    async function abrirSelector(alimento) {
      const secciones = await pedir(tabla("secciones").getAll());
      caja.innerHTML = "";
      const titulo = document.createElement("h2");
      titulo.textContent = "Sección de " + alimento.nombre;
      caja.appendChild(titulo);

      for (const s of secciones) {
        const b = document.createElement("button");
        b.textContent = s.nombre;
        if (s.clave === alimento.seccion) b.className = "actual";
        b.onclick = () => mover(alimento, s.clave);
        caja.appendChild(b);
      }

      // Casilla para escribir una sección nueva
      const nueva = document.createElement("div");
      nueva.className = "nueva";
      const campo = document.createElement("input");
      campo.type = "text";
      campo.placeholder = "Nueva sección";
      campo.autocomplete = "off";
      const guardar = document.createElement("button");
      guardar.textContent = "Ok";
      const crear = () => crearSeccion(alimento, campo.value);
      guardar.onclick = crear;
      campo.onkeydown = e => { if (e.key === "Enter") crear(); };
      nueva.append(campo, guardar);
      caja.appendChild(nueva);

      velo.classList.add("abierto");
    }

    async function mover(alimento, seccion) {
      alimento.seccion = seccion;
      await pedir(tabla("alimentos", "readwrite").put(alimento));
      velo.classList.remove("abierto");
      pintar();
    }

    async function crearSeccion(alimento, texto) {
      const nombre = texto.trim();
      if (!nombre) return;
      try {
        await pedir(tabla("secciones", "readwrite").add({ clave: clave(nombre), nombre }));
      } catch (e) {
        // Si ya existe, no se duplica: se usa la que ya hay
        if (e.name !== "ConstraintError") { console.error(e); return; }
      }
      await mover(alimento, clave(nombre));
    }

    velo.onclick = e => { if (e.target === velo) velo.classList.remove("abierto"); };
    document.getElementById("ok").onclick = anadir;
    entrada.onkeydown = e => { if (e.key === "Enter") anadir(); };
    entrada.addEventListener("input", sugerir);
    entrada.addEventListener("focus", sugerir);

    // Al tocar fuera de la barra superior se cierran las sugerencias
    document.addEventListener("pointerdown", e => {
      if (!e.target.closest(".barra")) sugerenciasEl.style.display = "none";
    });

    (async () => {
      db = await abrirBD();
      await normalizarNombres();
      pintar();
    })();
  </script>
</body>
</html>
